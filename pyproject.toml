[project]
name = "kickoff"
version = "0.4.1"
description = "Scaffold new development projects with one command"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tomlkit>=0.12.0",
]

[project.scripts]
kickoff = "kickoff.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "vulture>=2.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kickoff"]

# NOTE: keep these values in sync with src/kickoff/defaults.py
# (tests/test_defaults.py fails if they drift apart).
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "PTH", "B", "C4", "SIM", "RET", "PL", "N"]

[tool.ruff.lint.per-file-ignores]
"src/kickoff/commands/new.py" = ["PLR0913"]
"tests/**" = ["PLR2004"]

[tool.vulture]
min_confidence = 80
paths = ["src"]
sort_by_size = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
